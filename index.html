<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/applydir-favicon.svg" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch/home-bar
         so it feels full-screen when installed; safe-area padding handled in CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ApplyDir finds who's hiring and introduces you. Your AI headhunter for remote roles." />

    <!-- PWA / installability -->
    <meta name="theme-color" content="#FF5B2E" />

    <!-- iOS: Safari ignores the web manifest for home-screen install, so these
         Apple-specific tags are what make it open full-screen with our icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ApplyDir" />
    <link rel="apple-touch-icon" href="/applydir-apple-touch-icon-180.png" />
    <title>ApplyDir — Your AI Headhunter</title>
    <link rel="canonical" href="https://applydir.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://applydir.com/" />
    <meta property="og:site_name" content="ApplyDir" />
    <meta property="og:title" content="ApplyDir — Your AI Headhunter" />
    <meta property="og:description" content="It finds who's hiring and introduces you. Directly to the hiring manager, from your own inbox." />
    <meta property="og:image" content="https://applydir.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stop applying into the void. We reach the person who does the hiring." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@jatotech" />
    <meta name="twitter:creator" content="@jatotech" />
    <meta name="twitter:title" content="ApplyDir — Your AI Headhunter" />
    <meta name="twitter:description" content="It finds who's hiring and introduces you." />
    <meta name="twitter:image" content="https://applydir.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
