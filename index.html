<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch/home-bar
         so it feels full-screen when installed; safe-area padding handled in CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ApplyDir finds who's hiring and introduces you. Your AI headhunter for remote roles." />

    <!-- PWA / installability -->
    <meta name="theme-color" content="#FF5B2E" />

    <!-- iOS: Safari ignores the web manifest for home-screen install, so these
         Apple-specific tags are what make it open full-screen with our icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ApplyDir" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>ApplyDir — Your AI Headhunter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque, variable on both axes: opsz 12–96, wght 200–800.
         One family for the whole app. The optical-size axis is what makes that
         work — see `font-optical-sizing: auto` in index.css, which lets the
         browser pick the right optical size from the rendered font-size, so
         display text gets the characterful cut and 12px UI text gets the
         calmer one without us hand-tuning anything. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
